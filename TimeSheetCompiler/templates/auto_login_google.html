{% load static socialaccount %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Collegamento a Google</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="flex min-h-screen items-center justify-center bg-fondo px-4 font-sans text-grigio">
<form id="autoform" method="post"
      action="{% provider_login_url 'google' process='connect' %}"
      class="text-center">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <p>Ti stiamo portando su Google per collegare il calendario…</p>
    <noscript>
        <button type="submit" class="mt-4 rounded-md bg-bosco px-4 py-2 font-semibold text-carta hover:bg-bosco-scuro">Continua su Google</button>
    </noscript>
</form>
<script>document.getElementById('autoform').submit();</script>
</body>
</html>
