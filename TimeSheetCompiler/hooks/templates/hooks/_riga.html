{% comment %}
Una riga per categoria. Il nome della categoria e' l'etichetta del campo delle
parole chiave; la categoria viaggia nel campo nascosto.
{% endcomment %}
<div class="grid gap-2 px-5 py-4 sm:grid-cols-[minmax(0,2fr)_minmax(0,3fr)] sm:items-center sm:gap-4">
    <label for="{{ riga.keywords.id_for_label }}" class="pl-3 font-medium text-inchiostro first-letter:uppercase">{{ riga.category_label }}</label>
    <div>
        {{ riga.category }}
        {{ riga.keywords }}
        {{ riga.category.errors }}{{ riga.keywords.errors }}
    </div>
</div>
