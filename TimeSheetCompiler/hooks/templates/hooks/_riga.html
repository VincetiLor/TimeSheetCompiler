{% comment %}
Una regola del form. Usata sia per le righe esistenti sia per il <template>
da clonare (con riga=form.empty_form), cosi' le due non divergono.
{% endcomment %}
<div class="riga-regola grid gap-3 px-5 py-4 sm:grid-cols-[minmax(0,2fr)_minmax(0,3fr)] sm:gap-4">
    <div>
        <label for="{{ riga.category.id_for_label }}" class="sr-only">Categoria</label>
        {{ riga.category }}{{ riga.category.errors }}
    </div>
    <div>
        <div class="flex gap-2">
            <label for="{{ riga.keyword.id_for_label }}" class="sr-only">Parola chiave</label>
            {{ riga.keyword }}
            <button type="button" data-rimuovi aria-label="Rimuovi questa regola" title="Rimuovi questa regola" class="flex size-11 shrink-0 items-center justify-center rounded-md text-grigio transition-colors hover:bg-linea/70 hover:text-inchiostro focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-bosco">
                <svg aria-hidden="true" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" class="size-4"><path d="M5 5l10 10M15 5L5 15"/></svg>
            </button>
        </div>
        {{ riga.keyword.errors }}
    </div>
</div>
